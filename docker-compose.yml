services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8080:8080"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports: ["5173:80"]
    depends_on: [api]
    restart: unless-stopped
